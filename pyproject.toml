[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equation-splits-repro"
version = "0.1.0"
description = "Reproducibility artifact for equation-suffix forecasting experiments."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "pandas>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
sft-gpu = [
    "transformers>=4.57.0",
    "peft>=0.19.0",
    "accelerate>=1.13.0",
    "safetensors>=0.4.0",
    "tokenizers>=0.22.0",
]

[tool.setuptools.packages.find]
where = ["src"]

